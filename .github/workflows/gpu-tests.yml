name: Manual GPU tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cuda:
    # Manual trusted-main execution only. An operator must provision this runner;
    # its absence is not represented as successful automated GPU coverage.
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install application
        run: python -m pip install -e ".[dev,metrics]"
      - name: Require working CUDA hardware
        run: python -c "import torch; assert torch.cuda.is_available(); print(torch.cuda.get_device_name(0))"
      - name: Exercise mixed precision, EMA, classifier-free guidance and DDIM
        run: python -m pytest tests/test_gpu.py -q
