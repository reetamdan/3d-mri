repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff syntax and import checks
        entry: python -m ruff check
        language: system
        types: [python]
      - id: mypy-runtime
        name: Type-check runtime packages
        entry: python -m mypy
        language: system
        pass_filenames: false
        files: ^(src|app|mri3d|scripts)/.*\.py$
