repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff syntax and import checks
        entry: python -m ruff check
        language: system
        types: [python]
      - id: mypy-core
        name: Type-check portable artifacts and statistics
        entry: python -m mypy
        language: system
        pass_filenames: false
        files: ^src/(utils/artifacts|training/statistics)\.py$
