# College M4 reduced-cohort knee baseline; real training and validation.
shape: [128, 128, 32]
device: cuda
threads: 4
seed: 42
epochs: 40
batch_size: 2
steps_per_epoch: 48
learning_rate: 0.0003
smoke_test: false
initialize_codebook: true
select_best: true
vq:
  base: 16
  latent_channels: 8
  codes: 128
  commitment: 0.25
# Stable VQ-VAE is the trained M4 baseline; optional VQ-GAN remains available.
gan_weight: 0
gan_start_epoch: 5
unet_base: 32
diffusion_steps: 200
conditional: true
