[build-system]
requires = ["setuptools>=83,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "mri3d-research"
version = "0.2.0"
description = "Reproducible local 3D MRI preprocessing and latent generative modelling"
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.scripts]
mri3d = "scripts.research:main"
mri3d-study = "scripts.research_study:main"

[project.optional-dependencies]
dev = ["ruff>=0.9,<1", "mypy>=1.13,<2", "pytest-cov>=6,<8", "types-PyYAML>=6", "types-setuptools"]
metrics = ["pytorch-msssim>=1.0,<2"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.cmdclass]
build_py = "mri3d._build.BuildPy"

[tool.setuptools.packages.find]
include = ["mri3d*", "src*", "app*", "scripts*"]
exclude = ["tests*", "data*", "runs*"]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [".venv", ".pytest-tmp", ".test-artifacts", "data", "runs", "logs"]

[tool.ruff.lint]
select = ["E9", "F"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
packages = ["src", "app", "mri3d", "scripts"]

[tool.coverage.run]
branch = true
source = ["src", "app", "mri3d", "scripts"]

[tool.coverage.report]
show_missing = true
fail_under = 70
